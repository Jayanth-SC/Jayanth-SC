<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Planning scale</title>
  <desc id="d">Illustration of a supply network with 35 nodes, one per location. Key figures: 1,200 products, 35 locations, 180,000 planning combinations, 65 planners.</desc>
  <style>
    .bg { fill: #0d1117; }
    .h { font: 700 28px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .card { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .edge { stroke: #30363d; stroke-width: 1; }
    .n1 { fill: #58a6ff; } .n2 { fill: #2dd4bf; } .n3 { fill: #8b98a9; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-in-out infinite; }
    .num { font: 700 30px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .lab { font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b98a9; }
    .note { font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b98a9; }
    .stat { animation: fade .6s ease-out both; }
    @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.35); } }
    @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .pulse, .stat { animation: none !important; } .pkt { display: none; } }
  </style>
