<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Jayanth K: SAP supply chain planning consultant</title>
  <desc id="d">Name and positioning banner with a small animated supply network motif.</desc>
  <style>
    .bg { fill: #0d1117; }
    .name { font: 700 54px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .role { font: 600 22px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #58a6ff; }
    .tag { font: 500 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b98a9; }
    .rule { stroke: #30363d; stroke-width: 1; }
    .lane { stroke: #2dd4bf; stroke-width: 1.5; stroke-dasharray: 4 6; opacity: .75; animation: flow 2.4s linear infinite; }
    .node { fill: #161b22; stroke: #58a6ff; stroke-width: 2; }
    .n2 { stroke: #f5b942; }
    .rise { animation: rise .9s ease-out both; }
    .tag.t0 { animation: c0 15s infinite; }
    .tag.t1 { animation: c1 15s infinite; }
    .tag.t2 { animation: c2 15s infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    @keyframes c0 { 0%,30% {opacity:1} 33%,97% {opacity:0} 100% {opacity:1} }
    @keyframes c1 { 0%,30% {opacity:0} 33%,63% {opacity:1} 66%,100% {opacity:0} }
    @keyframes c2 { 0%,63% {opacity:0} 66%,97% {opacity:1} 100% {opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .rise, .lane, .tag { animation: none !important; }
    }
  </style>
  <rect class="bg" width="840" height="220" rx="12"/>
  <g class="rise">
    <text class="name" x="48" y="82">Jayanth K</text>
    <text class="role" x="48" y="118">SAP Supply Chain Planning Consultant</text>
  </g>
  <text class="tag t0" x="48" y="152" opacity="1">Demand &amp; supply planning at scale</text>
  <text class="tag t1" x="48" y="152" opacity="0">SAP IBP  ·  APO  ·  S/4HANA</text>
  <text class="tag t2" x="48" y="152" opacity="0">Data engineering  ·  ML  ·  Cloud</text>
  <line class="rule" x1="48" y1="178" x2="470" y2="178"/>
  <text class="tag" x="48" y="200" style="font-size:14px">Charlotte, NC</text>
  <g aria-hidden="true">
    <line class="lane" x1="560" y1="58" x2="640" y2="99"/>
    <line class="lane" x1="560" y1="140" x2="640" y2="99"/>
    <line class="lane" x1="640" y1="99" x2="730" y2="58"/>
    <line class="lane" x1="640" y1="99" x2="730" y2="140"/>
    <line class="lane" x1="730" y1="58" x2="790" y2="99"/>
    <line class="lane" x1="730" y1="140" x2="790" y2="99"/>
    <circle class="node n0" cx="560" cy="58" r="6"/>
    <circle class="node n1" cx="560" cy="140" r="6"/>
    <circle class="node n2" cx="640" cy="99" r="6"/>
    <circle class="node n0" cx="730" cy="58" r="6"/>
    <circle class="node n1" cx="730" cy="140" r="6"/>
    <circle class="node n2" cx="790" cy="99" r="6"/>
  </g>
</svg>
