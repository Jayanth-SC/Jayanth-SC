<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 620" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Core expertise</title>
  <desc id="d">Three groups. SAP planning: Demand Planning, Supply Planning, Inventory Optimization, S&amp;OP, Response &amp; Supply, Planning Areas, Key Figures, Master Data Types, Planning Levels, Time-Series Planning, Order-Based Planning, Supply Planning Heuristics, Supply Planning Optimizer, SAP IBP Configuration; Integration and analytics: IBP–S/4HANA Integration, CPI-DS / CI-DS, OData and IBP APIs, RTI, IBP Control Tower, IBP Excel Add-In, SAP BTP, SAP Datasphere, SAP Analytics Cloud; Consulting delivery: Requirements Workshops, Fit-to-Standard Workshops, Functional Design, SIT / UAT, Go-Live and Hypercare, Production Support, Business-to-Technical Translation.</desc>
  <style>
    .bg { fill: #0d1117; }
    .h { font: 700 28px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; animation: fade .6s ease-out both; }
    .card { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .gt { font: 700 17px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .gs { font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b98a9; }
    .ct { font: 500 13px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .chip { animation: fade .5s ease-out both; }
    .spine { stroke: #2dd4bf; stroke-width: 2; stroke-dasharray: 4 6; opacity: .8; animation: flow 2s linear infinite; }
    @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    @media (prefers-reduced-motion: reduce) { .h, .chip, .spine { animation: none !important; } }
  </style>
