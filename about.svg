<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 336" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">About Jayanth K</title>
  <desc id="d">SAP supply chain planning consultant with 4+ years in SAP IBP and SAP APO, covering demand planning, supply planning, inventory optimization and S&amp;OP, integrated with S/4HANA. Supported 65 planners across 1,200 products, 35 locations and 180,000 planning combinations. Certified on Databricks and AWS in data engineering, ML and generative AI. Builds open, documented projects where planning, data, AI and cloud meet. Projects are personal work on synthetic data.</desc>
  <style>
    .bg { fill: #0d1117; }
    .h { font: 700 28px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .ln { font: 400 17px ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1d9; animation: fade .7s ease-out both; }
    .note { font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b98a9; animation: fade .7s ease-out 3.2s both; }
    .bar { stroke: #2dd4bf; stroke-width: 3; stroke-dasharray: 60; animation: draw .8s ease-out both; }
    .hd { animation: fade .6s ease-out both; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes draw { from { stroke-dashoffset: 60; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .ln, .note, .bar, .hd { animation: none !important; } }
  </style>
  <rect class="bg" width="840" height="336" rx="12"/>
  <text class="h hd" x="48" y="56">About</text>
  <line class="bar" x1="48" y1="68" x2="108" y2="68"/>
  <text class="ln" style="animation-delay:0.50s" x="48" y="94">SAP supply chain planning consultant with 4+ years in SAP IBP and SAP APO,</text>
  <text class="ln" style="animation-delay:0.85s" x="48" y="122">covering demand planning, supply planning, inventory optimization and S&amp;OP,</text>
  <text class="ln" style="animation-delay:1.20s" x="48" y="150">integrated with S/4HANA. Supported 65 planners across 1,200 products,</text>
  <text class="ln" style="animation-delay:1.55s" x="48" y="178">35 locations and 180,000 planning combinations.</text>
  <text class="ln" style="animation-delay:1.90s" x="48" y="224">Certified on Databricks and AWS in data engineering, ML and generative AI.</text>
  <text class="ln" style="animation-delay:2.25s" x="48" y="252">I build open, documented projects where planning, data, AI and cloud meet.</text>
  <text class="note" x="48" y="302">Projects are personal work on synthetic data, not employer or client work.</text>
</svg>
